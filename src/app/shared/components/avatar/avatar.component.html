    @if (zFallback()) {
      <span [class]="fallbackClasses()" [attr.aria-hidden]="imageLoaded() ? 'true' : null">
        {{ zFallback() }}
      </span>
    }

    @if (zSrc() && !imageError()) {
      <img
        [width]="imgSize()"
        [height]="imgSize()"
        [alt]="zAlt()"
        [class]="imgClasses()"
        [src]="imgSrc()"
        [attr.fetchpriority]="zPriority() ? 'high' : 'auto'"
        loading="eager"
        decoding="async"
        (error)="onImageError()"
        (load)="onImageLoad()"
      />
    }

    @if (zShowBadge()) {
      <div [class]="badgeClasses()">
        @if (zBadgeIcon()) {
          <ng-icon [name]="zBadgeIcon()" size="8" />
        }
      </div>
    }
