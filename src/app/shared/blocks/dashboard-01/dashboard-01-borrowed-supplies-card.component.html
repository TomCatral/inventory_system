<section class="borrowed-indicator" aria-label="Borrowed supplies">
  <span class="borrowed-indicator-icon" aria-hidden="true"><ng-icon name="lucidePackageCheck" /></span>

  <div class="borrowed-indicator-copy">
    <p>Assigned supplies</p>
    <strong>Borrowed Supplies</strong>
    @if (error()) {
      <span class="borrowed-indicator-error" role="alert">{{ error() }}</span>
    } @else if (loading()) {
      <span>Checking pending returns...</span>
    } @else {
      <span class="borrowed-indicator-pending"><b>{{ pendingCount() }}</b> pending</span>
    }
  </div>

  <a routerLink="/home/reports/borrowed-supplies" class="borrowed-indicator-link">Open report →</a>
</section>
