<z-card class="pt-0">
  <z-card-header class="flex items-center gap-2 space-y-0 border-b py-5 sm:flex-row">
    <div class="grid flex-1 gap-1">
      <z-card-title zTitle="Stock movement" />
      <z-card-description zDescription="Quantities received and issued from recorded transactions" />
    </div>

    <z-card-action class="flex items-center gap-2">
      <z-toggle-group
        zMode="single"
        zType="outline"
        zSize="sm"
        [zItems]="ranges"
        [zValue]="range()"
        (valueChange)="onRangeChange($event)"
        class="hidden lg:flex"
        zItemClass="px-4!"
      />

      <z-select class="w-40 rounded-lg lg:hidden" [(zValue)]="range">
        @for (option of ranges; track option.value) {
          <z-select-item [zValue]="option.value">{{ option.label }}</z-select-item>
        }
      </z-select>
    </z-card-action>
  </z-card-header>

  <z-card-content class="px-2 pt-4 sm:px-6 sm:pt-6">
    @if (hasVisibleMovement()) {
      <z-chart
        zType="area"
        [zConfig]="chartConfig"
        [zData]="visibleData()"
        [zSeries]="series"
        zXAxisKey="date"
        [zXAxisFormatter]="shortDate"
        zStacked
        zGradient
        class="aspect-auto h-[250px] w-full"
      >
        <z-chart-tooltip zIndicator="dot" [zLabelFormatter]="longDate" />
      </z-chart>
    } @else {
      <p class="flex h-[250px] items-center justify-center text-sm text-muted-foreground">
        No stock-in or stock-out transactions for this period.
      </p>
    }
  </z-card-content>
</z-card>
