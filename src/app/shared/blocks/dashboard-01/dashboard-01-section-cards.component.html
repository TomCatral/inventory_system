<div class="status-grid">
  @for (card of cards(); track card.description) {
    <a [routerLink]="card.route" class="status-link">
      <z-card class="status-card dashboard-01-section-cards-01">
        <z-card-header>
          <div class="dashboard-01-section-cards-02">
            <z-card-description [zDescription]="card.description" />
            <span class="status-icon dashboard-01-section-cards-03"
              [class.dashboard-01-section-cards-state-01]="card.tone === 'default'" [class.dashboard-01-section-cards-state-02]="card.tone === 'default'"
              [class.dashboard-01-section-cards-state-03]="card.tone === 'warning'" [class.dashboard-01-section-cards-state-04]="card.tone === 'warning'"
              [class.dashboard-01-section-cards-state-05]="card.tone === 'danger'" [class.dashboard-01-section-cards-state-06]="card.tone === 'danger'">
              <ng-icon [name]="card.icon" />
            </span>
          </div>
          <z-card-title [zTitle]="card.value" class="dashboard-01-section-cards-04" />
        </z-card-header>
        <z-card-footer class="dashboard-01-section-cards-05"><div class="dashboard-01-section-cards-06">{{ card.caption }}</div></z-card-footer>
      </z-card>
    </a>
  }
</div>
