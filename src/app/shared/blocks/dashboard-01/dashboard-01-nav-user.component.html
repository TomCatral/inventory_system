<ul z-sidebar-menu [class.dashboard-01-nav-user-compact]="compact()">
  <li z-sidebar-menu-item>
    <button
      type="button"
      z-sidebar-menu-button
      zSize="lg"
      z-dropdown
      [zDropdownMenu]="userMenu"
      class="dashboard-01-nav-user-01"
    >
      <z-avatar class="dashboard-01-nav-user-02" [zSrc]="user().avatar" [zAlt]="user().name" [zFallback]="initials()" />

      <div class="dashboard-01-nav-user-03">
        <span class="dashboard-01-nav-user-04">{{ user().name }}</span>
        <span class="dashboard-01-nav-user-05">{{ user().email }}</span>
      </div>

      <ng-icon name="lucideEllipsisVertical" class="dashboard-01-nav-user-06" />
    </button>

    <z-dropdown-menu-content
      #userMenu="zDropdownMenuContent"
      class="dashboard-01-nav-user-07"
      [zSide]="menuSide()"
      zAlign="end"
    >
      <z-dropdown-menu-label class="dashboard-01-nav-user-08">
        <div class="dashboard-01-nav-user-09">
          <z-avatar class="dashboard-01-nav-user-10" [zSrc]="user().avatar" [zAlt]="user().name" [zFallback]="initials()" />

          <div class="dashboard-01-nav-user-11">
            <span class="dashboard-01-nav-user-12">{{ user().name }}</span>
            <span class="dashboard-01-nav-user-13">{{ user().email }}</span>
          </div>
        </div>
      </z-dropdown-menu-label>

      <z-dropdown-menu-separator />

      <z-dropdown-menu-group>
        <z-dropdown-menu-item (zSelected)="navigate('/home/account')">
          <ng-icon name="lucideUserCircle" />
          Account
        </z-dropdown-menu-item>
      </z-dropdown-menu-group>

      <z-dropdown-menu-separator />

      <z-dropdown-menu-item (zSelected)="logout()">
        <ng-icon name="lucideLogOut" />
        Log out
      </z-dropdown-menu-item>
    </z-dropdown-menu-content>
  </li>
</ul>
