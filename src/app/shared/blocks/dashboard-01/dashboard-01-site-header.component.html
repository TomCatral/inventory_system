<header
  class="dashboard-01-site-header-01"
>
  <div class="dashboard-01-site-header-02">
    <button type="button" z-sidebar-trigger class="dashboard-01-site-header-03" aria-label="Toggle navigation menu"></button>
    <z-separator zOrientation="vertical" class="dashboard-01-site-header-04" />
    <div class="dashboard-01-site-header-05">
      <p class="dashboard-01-site-header-06">{{ sectionTitle() }}</p>
      <h1 class="dashboard-01-site-header-07">{{ pageTitle() }}</h1>
    </div>
    <div class="dashboard-01-site-header-08">
      <time class="dashboard-01-site-header-09">{{ today }}</time>
      <button type="button" class="app-icon-button" [attr.aria-label]="isDark() ? 'Switch to light mode' : 'Switch to dark mode'" [title]="isDark() ? 'Light mode' : 'Dark mode'" (click)="toggleTheme()">
        <ng-icon [name]="isDark() ? 'lucideSun' : 'lucideMoon'" />
      </button>
      <button type="button" class="app-icon-button dashboard-01-site-header-10" [attr.aria-label]="unreadCount() ? 'View notifications, ' + unreadCount() + ' unread' : 'View notifications'" title="Notifications" (click)="drawerOpen.set(true)">
        <ng-icon name="lucideBell" />
        @if (unreadCount() > 0) {
          <span class="dashboard-01-site-header-11">
            {{ unreadCount() > 99 ? '99+' : unreadCount() }}
          </span>
        }
      </button>
      <lib-dashboard-01-nav-user [user]="user()" [compact]="true" />
    </div>
  </div>
</header>

<app-notification-drawer
  [open]="drawerOpen()"
  [canApprove]="isAdmin()"
  (closed)="drawerOpen.set(false)"
  (changed)="loadUnread()"
/>
