<ion-content [fullscreen]="true">
  <main class="login-shell">
    <section class="login-card">
      <img class="login-logo" src="assets/logo/cagayan.png" alt="PGC Logo">
      <p class="eyebrow">PGC INFORMATION SYSTEMS DIVISION</p>
       <p class="eyebrow">INVENTORY SYSTEM</p>
      <h1 class="signIn">SIGN IN</h1>
   
      @if (error) {
        <p class="notice danger" role="alert" aria-live="polite">{{ error }}</p>
      }
      <form (ngSubmit)="submit()">
        <ion-input label="Username" label-placement="stacked" fill="outline" [(ngModel)]="username" name="username"
          autocomplete="username" [disabled]="isSubmitting" (ionInput)="clearError()" required></ion-input>
        <ion-input label="Password" label-placement="stacked" fill="outline" type="password" [(ngModel)]="password"
          name="password" autocomplete="current-password" [disabled]="isSubmitting" (ionInput)="clearError()" required></ion-input>
        <ion-button expand="block" type="submit" [disabled]="isSubmitting || !username.trim() || !password">{{ isSubmitting ?
          'Signing in...' : 'Sign in' }}</ion-button>
      </form>
    </section>
  </main>
</ion-content>
