<ion-content [fullscreen]="true">
  <main class="auth-shell">
    <section class="form-panel" aria-labelledby="sign-in-title">
      <div class="form-card">
        <div class="form-card-accent" aria-hidden="true"></div>

        <div class="form-heading">
          <img
            class="login-logo"
            src="assets/logo/cagayan-128.png"
            width="64"
            height="64"
            decoding="async"
            alt="Province of Cagayan official seal"
          />
          <p class="form-eyebrow">Welcome back</p>
          <h1 id="sign-in-title">Sign in to your account</h1>
        </div>

        @if (error) {
          <div class="notice" role="alert" aria-live="assertive">
            <strong>{{ errorTitle }}</strong>
            <span>{{ error }}</span>
          </div>
        }

        <form (ngSubmit)="submit()" [attr.aria-busy]="isSubmitting">
          <ion-input
            label="Username"
            label-placement="stacked"
            fill="outline"
            [(ngModel)]="username"
            name="username"
            autocomplete="username"
            autofocus
            [disabled]="isSubmitting"
            (ionInput)="clearError()"
            required
          ></ion-input>

          <div class="password-field">
            <ion-input
              label="Password"
              label-placement="stacked"
              fill="outline"
              [type]="passwordVisible() ? 'text' : 'password'"
              [(ngModel)]="password"
              name="password"
              autocomplete="current-password"
              [disabled]="isSubmitting"
              (ionInput)="clearError()"
              required
            >
              <button
                slot="end"
                type="button"
                class="password-toggle"
                [attr.aria-label]="passwordVisible() ? 'Hide password' : 'Show password'"
                [attr.aria-pressed]="passwordVisible()"
                [disabled]="isSubmitting"
                (click)="togglePassword()"
              >
                @if (passwordVisible()) {
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M3 3l18 18" />
                    <path d="M9.9 5.7A9.7 9.7 0 0 1 12 5.5c6 0 9.5 6.5 9.5 6.5a16 16 0 0 1-3.1 3.7" />
                    <path d="M6.2 7.2A16 16 0 0 0 2.5 12S6 18.5 12 18.5a9.7 9.7 0 0 0 3.5-.7" />
                    <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2" />
                  </svg>
                } @else {
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z" />
                    <circle cx="12" cy="12" r="3" />
                  </svg>
                }
              </button>
            </ion-input>
          </div>

          <ion-button expand="block" type="submit" [disabled]="isSubmitting || !username.trim() || !password">
            <span class="sign-in-button-content">
              {{ isSubmitting ? 'Signing in…' : 'Sign in' }}
              <span class="sign-in-arrow" aria-hidden="true">→</span>
            </span>
          </ion-button>
        </form>

        <p class="form-footer">Need access? Contact your inventory administrator.</p>
      </div>
    </section>
  </main>
</ion-content>
